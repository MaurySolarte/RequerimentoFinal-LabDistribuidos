syntax = "proto3";

package servicios;
option go_package = "/serviciosAudio";

service MetadataService {
  rpc ListAudioTypes(Empty) returns (AudioTypeList);
  rpc ListAudiosByType(AudioTypeRequest) returns (AudioList);
  rpc GetAudioDetails(AudioByIdRequest) returns (AudioDetails);
}

message Empty {}

message AudioTypeRequest {
  int32 type_id = 1;
}

message AudioByIdRequest {
  int32 audio_id = 1;
}

message AudioType {
  int32 id = 1;
  string name = 2;
}

message AudioTypeList {
  repeated AudioType items = 1;
}

message AudioSummary {
  int32 id = 1;
  int32 type_id = 2;
  string title = 3;
}

message AudioList {
  repeated AudioSummary items = 1;
}

message MetadataItem {
  string key = 1;
  string value = 2;
}

message AudioDetails {
  int32 id = 1;
  int32 type_id = 2;
  string type_name = 3;
  string title = 4;
  string filename = 5;
  repeated MetadataItem metadata = 6;
}
