<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Spotify</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="funciones.js" defer></script>
  <script src="animaciones.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="animaciones.css">
  <link rel="stylesheet" href="top-bar.css">
  <link rel="stylesheet" href="reproductor.css">
</head>

<body>
  <div class="top-bar">
    <div class="usuario-grupo">
      <label for="nickname">Nickname del usuario:</label>
      <input type="text" id="nickname" placeholder="Ej: usuario123">
    </div>

    <div class="botones_conexion">
      <button id="btnConectar" onclick="conectar()">Conectar</button>
      <button id="btnDesconectar" onclick="desconectar()" disabled>Desconectar</button>
    </div>
  </div>

  <!-- Grid principal -->
  <div class="grid">



    <!-- 1. Reproductor simulado -->
    <div class="card" style="display:flex; flex-direction:column; gap:1rem;">
      <div class="player-area">
        <div class="song-info">
          <div class="song-title" id="song-title">Aqui va el titulo de la cancion</div>
          <div class="song-artist" id="song-artist"> Aqui va el nombre del artista</div>
        </div>


        <div class="controls">
          <button class="play-btn" id="play-btn" onclick="togglePlay()">
            <i class="fa-solid fa-play" id="play-icon"></i>
          </button>
        </div>

      </div>
    </div> <!-- Aqui acaba el reproductor simulado-->

    <!-- 2. Usuarios reproduciendo -->
    <div class="card">
      <div class="nick-list" id="playing-list">
        <span class="empty-state">Nadie reproduciendo aún</span>
      </div>
    </div> <!-- Aqui acaba la seccion de usuarios reproduciendo-->

    <!-- 3. Feed de reacciones -->
    <div class="card">
      <div id="reacciones">
        <i class="fa-solid fa-thumbs-up reaction icon-like" data-reaction="like"
          onclick="enviarReaccionServidor(event)"></i>
        <i class="fa-solid fa-heart reaction icon-heart" data-reaction="heart"
          onclick="enviarReaccionServidor(event)"></i>
        <i class="fa-solid fa-face-sad-tear reaction icon-sad" data-reaction="sad"
          onclick="enviarReaccionServidor(event)"></i>
        <i class="fa-solid fa-face-laugh reaction icon-fun" data-reaction="fun"
          onclick="enviarReaccionServidor(event)"></i>
      </div>

      <div id="chat">
        <h3>Reacciones recibidas</h3>
        <div id="mensajes">
          <!-- Las reacciones se mostrarán aquí -->
        </div>
      </div>
    </div> <!-- Aqui acaba la seccion de reacciones-->

    <!-- 4. Usuarios que detuvieron -->
    <div class="card">
      <div class="nick-list" id="stopped-list">
        <span class="empty-state">Nadie ha detenido la reproducción</span>
      </div>
    </div> <!-- Aqui acaba la seccion de usuarios que detuvieron-->

  </div><!-- /grid -->

















</body>

</html>
